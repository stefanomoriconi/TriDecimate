[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decimate"
version = "1.3.0"
description = "High-performance, deterministic triangle-mesh decimation (greedy edge-collapse) with a stable C ABI, OpenMP CPU backend and optional CUDA GPU backend, wrapped for Python via ctypes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "decimate maintainers" },
]
keywords = ["mesh", "decimation", "geometry", "openmp", "cuda", "ctypes"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
test = ["pytest>=6.0"]

[project.urls]
# Replace with your real repository URL when publishing.
Homepage = "https://github.com/OWNER/decimate"
Source = "https://github.com/OWNER/decimate"
Issues = "https://github.com/OWNER/decimate/issues"

# ---------------------------------------------------------------------------
#  Packaging: the pure-Python wrapper is importable straight from the
#  `python/` directory (no compiled code ships in the wheel). The native
#  shared library is built with CMake (see docs/building.md) and located at
#  runtime via the DECIMATE_LIB / DECIMATE_LIB_DIR environment variables or
#  the standard install directories. This keeps the package trivially
#  cross-platform without embedding platform-specific binaries.
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "python" }
py-modules = ["decimate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
